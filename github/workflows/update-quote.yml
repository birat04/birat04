name: Update Daily Quote

on:
  schedule:
    - cron: '30 2 * * *'  # 8:00 AM IST = 02:30 UTC (UTC+5:30)
  workflow_dispatch:

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: sudo apt-get install -y jq

      - name: Fetch quote
        id: get-quote
        run: |
          if ! QUOTE_JSON=$(curl -sf "https://api.quotable.io/random"); then
            echo "::error::Failed to fetch quote from API"
            exit 1
          fi
          
          CONTENT=$(echo "$QUOTE_JSON" | jq -r '.content' | sed -e 's/[\/&]/\\&/g')
          AUTHOR=$(echo "$QUOTE_JSON" | jq -r '.author' | sed -e 's/[\/&]/\\&/g')
          
          echo "QUOTE_CONTENT=$CONTENT" >> $GITHUB_ENV
          echo "QUOTE_AUTHOR=$AUTHOR" >> $GITHUB_ENV

      - name: Update README
        run: |
          sed -i "/<!-- QUOTE_START -->/,/<!-- QUOTE_END -->/c\
          <!-- QUOTE_START -->\n> \"${{ env.QUOTE_CONTENT }}\" – ${{ env.QUOTE_AUTHOR }}\n<!-- QUOTE_END -->" README.md

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Update daily quote"
          git push
