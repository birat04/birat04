name: Update Daily Quote

on:
  schedule:
    - cron: '0 0 * * *'  # Runs every day at midnight (UTC)
  workflow_dispatch:     # Allow manual runs

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get install -y jq  # Install JSON parser

      - name: Fetch quote from API
        id: get-quote
        run: |
          # Fetch quote data from Quotable API
          QUOTE_JSON=$(curl -s "https://api.quotable.io/random")
          echo "QUOTE_CONTENT=$(echo $QUOTE_JSON | jq -r '.content')" >> $GITHUB_ENV
          echo "QUOTE_AUTHOR=$(echo $QUOTE_JSON | jq -r '.author')" >> $GITHUB_ENV

      - name: Update README
        run: |
          # Replace the old quote with the new one
          sed -i "/<!-- QUOTE_START -->/,/<!-- QUOTE_END -->/c\\
          <!-- QUOTE_START -->\\
          > \"${{ env.QUOTE_CONTENT }}\" – ${{ env.QUOTE_AUTHOR }}\\
          <!-- QUOTE_END -->" README.md

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add README.md
          git commit -m "Auto: Update daily quote"
          git push